<!DOCTYPE html>
<html>
<head>
    <title>Predictify AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
/* ================= BACKGROUND ================= */
.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    background: radial-gradient(circle at 20% 30%, #1a0033, #000000);
    overflow: hidden;
}

/* ================= ICONS ================= */
.background .icon {
    position: absolute;
    bottom: -50px; /* start below the screen */
    font-size: 2rem;
    color: white;
    opacity: 0;
    animation: rise linear infinite, blink ease-in-out infinite;
}

/* Randomize each icon’s properties */
.background .icon:nth-child(1) { left: 10%; animation-duration: 12s, 2s; font-size: 2rem; animation-delay: 0s, 0s; }
.background .icon:nth-child(2) { left: 25%; animation-duration: 15s, 1.5s; font-size: 1.8rem; animation-delay: 2s, 0.5s; }
.background .icon:nth-child(3) { left: 40%; animation-duration: 10s, 2.5s; font-size: 2.2rem; animation-delay: 1s, 1s; }
.background .icon:nth-child(4) { left: 55%; animation-duration: 18s, 1.8s; font-size: 2rem; animation-delay: 3s, 0.3s; }
.background .icon:nth-child(5) { left: 70%; animation-duration: 14s, 2.2s; font-size: 1.9rem; animation-delay: 1.5s, 0.7s; }
.background .icon:nth-child(6) { left: 85%; animation-duration: 16s, 1.6s; font-size: 2.1rem; animation-delay: 2.5s, 1s; }
.background .icon:nth-child(7) { left: 30%; animation-duration: 20s, 2.5s; font-size: 2rem; animation-delay: 0.5s, 0.2s; }
.background .icon:nth-child(8) { left: 60%; animation-duration: 13s, 1.7s; font-size: 2.3rem; animation-delay: 3s, 0.6s; }

/* ================= FLOAT UP + DRIFT ================= */
@keyframes rise {
    0% {
        bottom: -50px;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: 0.6;
    }
    50% {
        transform: translateX(20px) rotate(15deg);
    }
    70% {
        transform: translateX(-20px) rotate(-15deg);
    }
    100% {
        bottom: 110%;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
    }
}

/* ================= BLINK / GLOW ================= */
@keyframes blink {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
}

/* ================= BODY ================= */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
}

/* ================= CONTAINER ================= */
.container {
    position: relative;
    margin: 120px auto;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    z-index: 10;
    width: 350px;

    box-shadow: 0 0 25px rgba(103, 35, 167, 0.6);
}

/* ================= BUTTONS ================= */
.buttons {
    display: flex;
    gap: 10px;
}

.buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(45deg, #7c3aed, #00f2fe);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.buttons button:hover {
    transform: scale(1.05);
}

/* ================= FILE INPUT ================= */
input[type="file"] {
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    cursor: pointer;
}

/* 🔥 Fix invisible text */
input[type="file"]::file-selector-button {
    background: #7c3aed;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
}

/* ================= NAVBAR ================= */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: flex-end;
    gap: 15px;

    padding: 12px 20px;
    z-index: 1000;

    background: rgba(0, 0, 0, 0.5); /* 🔥 Added for visibility */
    backdrop-filter: blur(10px);
}

/* Navbar links */
.navbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    margin-right:30px
}

/* ================= FIX CONTENT OVERLAP ================= */
body {
    margin-top: 60px;  /* Prevent navbar overlap */
}
    </style>
</head>

<body>
    <h1>Predictify AI</h1>
    <!-- AI PARTICLES -->
<div class="ai-bg">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- BACKGROUND -->
<div class="background">
    <div class="icon">💼</div>
    <div class="icon">👤</div>
    <div class="icon">🤖</div>
    <div class="icon">📊</div>
    <div class="icon">💡</div>
    <div class="icon">🧠</div>
    <div class="icon">⚡</div>
    <div class="icon">🔮</div>
</div>

<!-- NAVBAR -->
<div class="navbar">
    <span class="user">👤 {{ username }}</span>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('logout') }}">Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="container">
    <h2>📂 Upload Customer CSV File</h2>

    <!-- ✅ FORM START -->
    <form method="post" enctype="multipart/form-data">

        <input type="file" name="file" accept=".csv" required>
        <br><br>

        <div class="buttons">
          <button type="submit" formaction="/upload">AI Prediction</button>
          <button type="submit" formaction="/summary">Quick Summary</button>
        </div>
        <div id="loader" style="display:none;">
    <p style="color:#a855f7;">⚡ AI Processing...</p>
</div>

<script>
document.querySelector("form").onsubmit = function() {
    document.getElementById("loader").style.display = "block";
};
</script>

    </form>
    <!-- ✅ FORM END -->

</div>

</body>
</html>
