<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <style>
        /* ================= BODY ================= */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* ================= FORM CONTAINER ================= */
        .container {
            background: rgba(0, 0, 0, 0.75);
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            text-align: center;
            width: 350px;
            max-width: 90%;
        }

        h2 {
            margin-bottom: 25px;
            color: #00ffff;
            letter-spacing: 1px;
            font-size: 24px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0 20px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        button {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
            font-size: 16px;
        }

        button:hover {
            background: #00bcd4;
        }

        p a {
            color: #00ffff;
            text-decoration: none;
            transition: 0.3s;
        }

        p a:hover {
            text-decoration: underline;
            color: #00bcd4;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
        }

        .error {
            background: #ff4c4c33;
            color: #ff4c4c;
        }

        .success {
            background: #00ff9933;
            color: #00ff99;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2>Forgot Password</h2>

        {% if error %}
            <div class="message {% if "✅" in error %}success{% else %}error{% endif %}">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Submit</button>
        </form>

        <p><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</body>
</html>
